[package]
name = "engine-editor"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
engine-control.workspace = true
engine-protocol.workspace = true
engine-core.workspace = true
engine-document.workspace = true
rfd = { version = "=0.17.2", default-features = false }
eframe = { version = "=0.37.0", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "system_fonts",
    "clipboard",
    "accesskit",
] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
