# 로컬 crates.io 연결이 제한된 초기 준비용. 잠금 파일·공개 캐시 수신 후 제거한다.
name: Bootstrap editor dependencies

on:
  pull_request:
    branches: [build/reproducible-checks]

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Prepare Rust and generate actual dependency lock
        run: python scripts/dev.py setup
      - name: Prefetch public dependencies for the next document stage
        shell: bash
        run: |
          mkdir -p .tools/prefetch/src
          cat > .tools/prefetch/Cargo.toml <<'TOML'
          [package]
          name = "editor-dependency-prefetch"
          version = "0.0.0"
          edition = "2024"
          [workspace]
          [dependencies]
          image = { version = "0.25", default-features = false, features = ["png"] }
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          tempfile = "3"
          thiserror = "2"
          rfd = "=0.17.2"
          TOML
          echo 'fn main() {}' > .tools/prefetch/src/main.rs
          CARGO_HOME="$PWD/.tools/cargo" RUSTUP_HOME="$PWD/.tools/rustup" \
            .tools/cargo/bin/cargo fetch --manifest-path .tools/prefetch/Cargo.toml
      - name: Check editor and existing engine
        run: python scripts/dev.py check
      - name: Archive only public Cargo registry data
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import tarfile
          Path("artifacts").mkdir(exist_ok=True)
          registry = Path(".tools/cargo/registry")
          if registry.exists():
              with tarfile.open("artifacts/public-registry-macos.tar.gz", "w:gz") as archive:
                  archive.add(registry, arcname="registry")
      - name: Upload lockfile, registry and built editor
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-bootstrap-macos
          path: |
            Cargo.lock
            artifacts/public-registry-macos.tar.gz
            target/debug/engine-editor
          retention-days: 2
