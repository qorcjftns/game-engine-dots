name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Prepare pinned Rust toolchain and dependencies
        run: python scripts/dev.py setup
      - name: Check tools
        run: python scripts/dev.py doctor
      - name: Check formatting, lint, tests, build and CLI contract
        run: python scripts/dev.py check
      - name: Check lockfile remains unchanged
        run: git diff --exit-code -- Cargo.lock
      - name: Check a native window with an external CLI process
        run: python scripts/dev.py native-smoke
      - name: Preserve native session evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-session-${{ matrix.os }}
          path: |
            artifacts/native-session/frame-*.png
            artifacts/native-session/native-summary.json
            artifacts/native-session/native-host.log
          if-no-files-found: ignore
          retention-days: 7
