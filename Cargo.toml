[workspace]
members = ["crates/engine-core", "crates/engine-desktop", "crates/engine-cli"]
default-members = ["crates/engine-core", "crates/engine-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
engine-core = { path = "crates/engine-core" }
macroquad = { version = "=0.4.16", default-features = false }
