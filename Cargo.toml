[workspace]
members = [
    "crates/engine-runtime",
    "crates/engine-core",
    "crates/engine-desktop",
    "crates/engine-cli",
    "crates/engine-editor",
    "crates/engine-document",
    "crates/engine-protocol",
    "crates/engine-control",
    "crates/engine-mcp",
]
default-members = ["crates/engine-core", "crates/engine-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
engine-runtime = { path = "crates/engine-runtime" }
engine-core = { path = "crates/engine-core" }
engine-document = { path = "crates/engine-document" }
engine-protocol = { path = "crates/engine-protocol" }
engine-control = { path = "crates/engine-control" }
macroquad = { version = "=0.4.16", default-features = false }
